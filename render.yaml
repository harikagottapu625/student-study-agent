services:
  - type: web
    name: student-study-agent-backend
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: skill_gap_detector
      - key: FRONTEND_ORIGIN
        sync: false
      - key: AI_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite,gemini-3.5-flash,gemini-3.8-flash
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: opengpt-x/teuken-7b-instruct-commercial-v0.4
      - key: NVIDIA_API_URL
        value: https://integrate.api.nvidia.com/v1/chat/completions
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_URL
        value: https://api.openai.com/v1/chat/completions
